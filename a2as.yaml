variables:
  AGENT_DRY_RUN:
    type: env
    params:
      caller: [os.getenv]
      path: [agent.manager]
  AGENT_ID:
    type: env
    params:
      caller: [os.getenv]
      path: [agent.manager]
  AGENT_POLL_SECONDS:
    type: env
    params:
      caller: [os.getenv]
      path: [agent.manager]
  AGENT_TEST_USER_ID:
    type: env
    params:
      caller: [os.getenv]
      path: [agent.manager]
  DATABASE_PATH:
    type: env
    params:
      caller: [os.getenv]
      path: [shared.database.connection]
  OPENAI_API_KEY:
    type: env
    params:
      caller: [os.getenv, AsyncOpenAI]
      path: [shared.llm, agent.pipeline.analyze]
  OPENROUTER_API_KEY:
    type: env
    params:
      caller: [os.getenv, AsyncOpenAI]
      path: [shared.llm, agent.pipeline.analyze]
  PIPELINE_USE_AGENTS_ANALYZE:
    type: env
    params:
      caller: [os.getenv]
      path: [agent.pipeline.analyze]
  PIPELINE_USE_AGENTS_STRATEGY:
    type: env
    params:
      caller: [os.getenv]
      path: [agent.pipeline.strategy]

files:
  logs_dir:
    type: literal
    actions: [read, write]
    params:
      caller: [Path(logs), logs_dir.mkdir]

networks:
  api.openai.com:
    type: api
    actions: [GET]
    urls: [/v1]
    protocols: [https]
    ports: ["443"]
    params:
      caller: [_get_openai_client]
      links: [base_url]
  localhost:
    type: api
    actions: [GET]
    urls: [/v1]
    protocols: [http]
    ports: ["11434"]
    params:
      caller: [_get_ollama_client]
      links: [base_url]
  openrouter.ai:
    type: api
    actions: [GET]
    urls: [/api/v1]
    protocols: [https]
    ports: ["443"]
    params:
      caller: [_get_open_router]
      links: [base_url]
