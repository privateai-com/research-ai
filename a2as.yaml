agents:
  agent._get_analyzer:
    type: factory
    models: [get_agent_model]
    params:
      function: _get_analyzer
      name: Paper Analyzer
      output_type: AnalysisAgentOutput
      instructions: ['You are an expert research assistant. Given a paper''s title and abstract,', 'assess relevance to the
          user''s task, write a concise summary, and return', a percentage relevance., Return structured JSON.]
  agent._get_formatter:
    type: factory
    models: [get_agent_model]
    params:
      function: _get_formatter
      name: Telegram Formatter
      output_type: TelegramSummary
      instructions: [Format a set of analyzed papers into short Telegram HTML. Keep it compact., Output JSON with a single
          field `html` containing the final HTML.]
  agent._get_reporter:
    type: factory
    models: [get_agent_model]
    params:
      function: _get_reporter
      name: Decision Reporter
      output_type: DecisionReport
      instructions: [You are a research assistant. Given a user task and a small set of analyzed papers, 'with summaries and
          relevance, decide whether there are truly helpful items.', 'If there are, produce a plain text report focused on
          the user task:', '- Start with one header line: "Findings for your task: <task>"', '- Then list up to 3 items in
          this structure (each 1–2 lines):', '- <Title>', 'Why useful for this task: <one short sentence tailored to the task>',
        'Link: <url>', '- Be brief and actionable: 6–12 lines total for the whole report', '- Keep language clear and human-friendly;
          no HTML/Markdown, plain text only', 'IMPORTANT: Strictly fit within 3000 characters.', 'You must return a JSON object
          with two fields:', '{"should_notify": boolean, "report_text": string|null}', '- If there is nothing truly helpful,
          set should_notify=false and report_text=null', '- Otherwise set should_notify=true and report_text to the plain
          text report']
  agent._get_simplifier_agent:
    type: factory
    models: [get_agent_model]
    params:
      function: _get_simplifier_agent
      name: Notification Simplifier
      instructions: ['You rewrite technical research notifications into clear, friendly messages for a general audience.',
        'Goals:', '- Explain the finding in simple words (what was found and why it matters)', '- Avoid jargon and numbers
          unless essential', '- Keep it short and helpful', 'Output format:', '- 1 short title (no emojis in title)', '- 1–3
          short lines with the essence and usefulness', '- Final line: a call to action with the link label ''Open on arXiv:
          <link>''', 'Rules:', '- Use a warm tone, simple vocabulary, and short sentences', '- No markdown or HTML tags, only
          plain text', '- Max length 600 characters total']
  agent._get_strategy_agent:
    type: factory
    models: [get_agent_model]
    params:
      function: _get_strategy_agent
      name: Query Strategist
      output_type: QueryPlan
      instructions: ['You turn a user task into a compact set of search queries. For EACH query,', 'you must also choose the
          most relevant source among: arXiv, Google Scholar,', 'PubMed, GitHub.', '- Prefer concise keyword-style queries',
        '- Avoid redundancy between queries', '- Provide a short rationale per query', '- If source=arXiv, boolean-style with
          AND/OR/NOT is welcome; optional category constraints may apply', '- If source=PubMed, prefer biomedical terms and
          common synonyms', '- If source=GitHub, qualifiers like language:Python, stars:>100 are welcome', '- Keep the set
          small and high-precision', '- Output JSON matching the provided schema, including the "source" field per query']

models:
  get_agent_model:
    type: function
    agents: [agent._get_formatter, agent._get_analyzer, agent._get_reporter, agent._get_strategy_agent, agent._get_simplifier_agent]

